# Scheduled check. Cron minimum is 5 minutes; the job loops ~every 60s for
# about 5 minutes so consecutive runs cover nearly continuously.
# Concurrency queues overlapping runs instead of cancelling or doubling.
name: scheduled-check

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: qx7-notes
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check levels
        env:
          WATCHER_WEBHOOK_URL: ${{ secrets.WATCHER_WEBHOOK_URL }}
          WATCHER_WEBHOOK_KEY: ${{ secrets.WATCHER_WEBHOOK_KEY }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_state() {
            if [ ! -f .state-changed ] || ! grep -qx 'yes' .state-changed; then
              echo "No meaningful state change; skipping commit"
              return 0
            fi
            git add watch-levels.json
            if git diff --cached --quiet; then
              echo "Flag set but no file diff; skipping commit"
              return 0
            fi
            git commit -m "chore: update state [skip ci]"
            local attempt
            for attempt in 1 2 3 4 5; do
              if git pull --rebase origin HEAD && git push; then
                echo "State committed and pushed"
                return 0
              fi
              echo "Push conflict or race (attempt ${attempt}); retrying"
              sleep $((attempt * 3))
            done
            echo "ERROR: failed to push state after retries" >&2
            return 1
          }

          end=$((SECONDS + 300))
          iter=0
          while true; do
            iter=$((iter + 1))
            loop_start=$SECONDS
            echo "loop_iter=${iter} elapsed=${SECONDS}s"
            python3 check.py
            commit_state
            if [ "$SECONDS" -ge "$end" ] || [ "$iter" -ge 5 ]; then
              echo "loop done iter=${iter} elapsed=${SECONDS}s"
              break
            fi
            remain=$((60 - (SECONDS - loop_start)))
            if [ "$remain" -lt 1 ]; then
              remain=1
            fi
            # Do not overshoot the 5-minute window by much.
            leftover=$((end - SECONDS))
            if [ "$leftover" -le 0 ]; then
              echo "loop done iter=${iter} elapsed=${SECONDS}s"
              break
            fi
            if [ "$remain" -gt "$leftover" ]; then
              remain=$leftover
            fi
            echo "sleep ${remain}s until next iter"
            sleep "$remain"
          done
